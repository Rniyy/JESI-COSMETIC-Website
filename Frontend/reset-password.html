<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — JESI-COSMETIC</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="auth.css" />
  <style>
    .reset-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #fdf8f6;
    }
    .reset-card {
      width: 100%;
      max-width: 380px;
      background: #fff;
      border-radius: 16px;
      padding: 32px 28px;
      box-shadow: 0 10px 40px rgba(58, 46, 43, 0.08);
    }
    .reset-logo {
      text-align: center;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 4px;
      color: #3a2e2b;
    }
    .reset-title {
      text-align: center;
      font-size: 14px;
      color: #6b5b56;
      margin-bottom: 24px;
    }
    .reset-back {
      display: block;
      text-align: center;
      margin-top: 18px;
      font-size: 13px;
      color: #dda297;
      text-decoration: underline;
      text-underline-offset: 2px;
    }
  </style>
</head>
<body>
  <div class="reset-wrap">
    <div class="reset-card">
      <div class="reset-logo">JESI — COSMETIC</div>
      <p class="reset-title">Choose a new password</p>

      <form class="auth-form" id="resetForm">
        <p class="auth-error" id="resetError" style="display:none;"></p>
        <p class="auth-success" id="resetSuccess" style="display:none;"></p>

        <label class="auth-label">New password
          <input class="auth-input" type="password" id="newPassword" required minlength="8" autocomplete="new-password" />
        </label>
        <label class="auth-label">Confirm new password
          <input class="auth-input" type="password" id="confirmPassword" required minlength="8" autocomplete="new-password" />
        </label>
        <button class="auth-submit-btn" type="submit" id="resetSubmitBtn">Reset password</button>
      </form>

      <a class="reset-back" href="index.html">Back to home</a>
    </div>
  </div>

  <script>
    const API = 'http://localhost:3000/api';

    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');

    const form        = document.getElementById('resetForm');
    const errorBox     = document.getElementById('resetError');
    const successBox    = document.getElementById('resetSuccess');
    const submitBtn    = document.getElementById('resetSubmitBtn');

    function showError(msg) {
      errorBox.textContent = msg;
      errorBox.style.display = 'block';
      successBox.style.display = 'none';
    }

    if (!token) {
      form.style.display = 'none';
      showError('This reset link is missing its token — please request a new one from the login panel.');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.style.display = 'none';
      successBox.style.display = 'none';

      const newPassword     = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (newPassword.length < 8) {
        showError('Password must be at least 8 characters');
        return;
      }
      if (newPassword !== confirmPassword) {
        showError('Passwords do not match');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Resetting...';

      try {
        const res  = await fetch(`${API}/auth/reset-password`, {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ token, newPassword }),
        });
        const json = await res.json();

        if (!json.success) {
          showError(json.message || 'Could not reset password');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Reset password';
          return;
        }

        form.style.display = 'none';
        successBox.textContent = 'Password updated — you can now log in with your new password.';
        successBox.style.display = 'block';
      } catch (err) {
        console.error(err);
        showError('Something went wrong — try again');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Reset password';
      }
    });
  </script>
</body>
</html>
